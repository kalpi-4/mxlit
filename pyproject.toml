[build-system]
# >=1.18 is required for reliable PEP 660 editable-install support (build_editable
# hook). Without a floor here, build isolation can silently resolve an older
# hatchling that lacks it, and pip falls back to a regular (non-editable) install
# with no error — `pip install -e .` then serves a frozen copy of the package that
# never reflects further source edits until manually reinstalled.
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "mxlit"
version = "0.1.2"
description = "A Streamlit alternative powered by FastAPI and HTMX"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Kalpit Bhawalkar", email = "kalpit@dolphins.dev" }
]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Framework :: FastAPI",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "jinja2>=3.1.6",
    "python-multipart>=0.0.22",
    "pandas>=3.0.1",
    "markdown>=3.10.2"
]

[project.urls]
Homepage = "https://dolphins.dev/"
Repository = "https://github.com/kalpi-4/mxlit"
Issues = "https://github.com/kalpi-4/mxlit/issues"

[project.scripts]
mxlit = "mxlit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mxlit"]

[dependency-groups]
dev = [
    "pytailwindcss>=0.3.1",
    "pytest>=9.0.3",
    "requests>=2.34.0",
]
