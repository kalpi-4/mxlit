<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mxlit App</title>
    <!-- Include HTMX -->
    <script src="/static/htmx.min.js"></script>
    <!-- Include Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <!-- The form wraps the root so that all inputs are submitted on interaction.
         hx-target and hx-swap here ensure button clicks (form submits) update #app-root. -->
    <form hx-post="/interact" hx-target="#app-root" hx-swap="innerHTML settle:0" style="width: 100%; margin: 0; padding: 0;">
        <div id="app-root" class="main-layout" hx-get="/initial" hx-trigger="load" hx-target="#app-root" hx-swap="innerHTML settle:0">
            <p style="padding: 2rem;">Loading app...</p>
        </div>
    </form>

    <script>
        // Targeted SSE updates via plain EventSource (avoids HTMX extension conflicts)
        (function () {
            const evtSource = new EventSource('/events');
            evtSource.addEventListener('targetedUpdate', function (evt) {
                const lines = evt.data.split('\n');
                lines.forEach(function (line) {
                    const sep = line.indexOf('\t');
                    if (sep === -1) return;
                    const componentId = line.slice(0, sep);
                    const htmlFragment = line.slice(sep + 1);
                    const el = document.getElementById(componentId);
                    if (el) el.innerHTML = htmlFragment;
                });
            });
            evtSource.addEventListener('close', function () { evtSource.close(); });
        })();

        // Tab switching helper used by inline onclick handlers in rendered tabs
        function activateTab(tabsId, activeIndex) {
            const tabsEl = document.getElementById(tabsId);
            if (!tabsEl) return;
            const headers = tabsEl.querySelectorAll('.st-tab-header');
            const contents = tabsEl.querySelectorAll('.st-tab-content');
            headers.forEach(function (h, i) { h.classList.toggle('active', i === activeIndex); });
            contents.forEach(function (c, i) { c.classList.toggle('active', i === activeIndex); });
        }

        // Re-initialise Chart.js canvases and tab state after every HTMX swap
        document.body.addEventListener('htmx:afterSwap', function () {
            // Activate first tab in every tabs group that lost its active state
            document.querySelectorAll('.st-tabs').forEach(function (tabsEl) {
                const activeContent = tabsEl.querySelector('.st-tab-content.active');
                if (!activeContent) {
                    activateTab(tabsEl.id, 0);
                }
            });
        });
    </script>
</body>
</html>
